<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>某聊天产品</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 720px; margin: 60px auto; text-align: center; }
  textarea { width: 70%; height: 90px; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font: inherit; }
  button { margin-top: 10px; padding: 8px 24px; }
</style>
</head>
<body>
<h1>探索未至之境</h1>
<p>问点什么，一起探索</p>
<textarea id="chat" placeholder="问点什么，一起探索"></textarea>
<div><button type="button">发送</button></div>
<script>
  // 回归用途：页面上只有一个"聊天输入框"（孤儿 textarea），插件不应报告任何网申字段
  window.__lonelyProbe = () => document.querySelectorAll('textarea').length;
</script>
</body>
</html>
