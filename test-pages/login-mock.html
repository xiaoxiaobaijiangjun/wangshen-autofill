<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>登录/绑定手机号 mock</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 420px; margin: 60px auto; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .code { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { padding: 9px 20px; width: 100%; }
</style>
</head>
<body>
<h2>绑定手机号/邮箱</h2>
<p>绑定手机号或邮箱，即可完成注册</p>
<div class="row">
  <span>+86</span>
  <input class="code" type="tel" placeholder="请输入手机号" />
</div>
<div class="row">
  <input class="code" type="text" placeholder="请输入验证码" />
  <button type="button" onclick="alert('（mock）已发送')">获取验证码</button>
</div>
<button type="button">登录</button>
<script>
  // 回归用途：登录/验证页应被识别为 pageKind=login 并抑制全部填充
  window.__loginProbe = () => document.querySelectorAll('input').length;
</script>
</body>
</html>
